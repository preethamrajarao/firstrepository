name: Commit to Protected Branch

on:
  workflow_dispatch:  # Manual trigger
  # Or use other triggers like:
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  commit-changes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release/test  # Your release branch name
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0  # Fetch all history for all branches
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Make changes
        run: |
          # Example: Update a file
          echo "Updated at $(date)" >> changes.txt
          
          # Your custom commands here
          # e.g., run scripts, modify files, etc.
      
      - name: Commit and push changes
        run: |
          git add .
          git commit -m "chore: automated update [skip ci]" || echo "No changes to commit"
          git push origin release/test
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
